name: Department authorization and build
on:
  pull_request:
  push:
    branches: [department-enscribe-endepth]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: department-ui-screenshots
          path: test-results/*.png
      - run: npm run build
      - run: git diff --check
